<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Cue Hackathon</title>
    <meta name="description" content="Social Cue Hackathon project." />
    <!--Accumulus Validator-->
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            --color-1: #4a7c59;
            --color-2: #6457a6;
            --color-3: #ef959d;
            --color-4: #d8d78f;
            --color-5: #89cff0;
            color: var(--color-4);

            --emotion-color-happy: #89cff0;
            --emotion-color-sad: #6457a6;
            --emotion-color-angry: #ef959d;
            --emotion-color-surprised: #d8d78f;
            --emotion-color-neutral: #4a7c59;
        }

        .video-frame {
            width: 90%;
            max-width: 750px;
            aspect-ratio: 1 / 1;
            border: 8px solid var(--emotion-color-angry);
            border-radius: 20px;
            overflow: hidden;
            margin: 1rem auto;
            background: #111;
            box-shadow: 0 6px 25px rgba(0,0,0,0.25), inset 0 0 10px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            display: flex; 
            justify-content: center;
            align-items: center;
        }


        #capture {
            display: block;
            margin: 1rem auto;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            background-color: var(--color-2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            background: linear-gradient(145deg, #4a7c59 0%, #3c6549 100%);
        }

        header, footer {
            text-align: center;
            padding: 1rem;
        }

        main {
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
            color: var(--color-4);
            display: flex;
            flex-direction: column;
        }

        section {
            background-color: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        #emotion-box {
            width: 90px;
            height: 90px;
            margin: 1rem auto;
            border-radius: 50%;
            background-color: var(--emotion-color-happy);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;     
            object-position: center;
            display: block; 
        }

        #emotion-grid {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            padding: 1rem 1;
        }

        #emotion-grid > section {
            flex: 1;
            min-width: 250px;
            height: auto;
            padding: 1.5rem;
        }

        #camera {
            flex: 1.6;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 1rem;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        #emotion-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 400px;
            background: rgba(255,255,255,0.04);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <header>
        <h1>Social Cue Hackathon</h1>
    </header>

    <main>
        <section id="about">
            <h2>About</h2>
            <p>Social Cue is an AI-powered web app that analyzes facial expressions in real time to indentify human emotions.</p>
        </section>

        <section id="emotion-grid">
            <section id="emotion-display">
                <h2>Detected Emotion</h2>
                <div id="emotion-box"></div>
                <p id="emotion-text">No emotion detected yet.</p>
            </section>

            <section id="camera">
                <h2>Camera Feed</h2>
                <div class="video-frame">
                    <video id="webcam" autoplay muted playsinline></video>
                </div>
                <button id="capture">Analyze Emotion</button>
            </section>

            <section id="hermes-insight">
                <h2>Further Insight - Kronoslabs</h2>
                <div id="hermes-box"><p>Enter Context Here...</p></div>
                <p id="hermes-output">Hermes Response here</p>
            </section>
        </section>
    </main>

    <footer>
        <small>&copy; 2025</small>
    </footer>
    <script src="{{ url_for('static', filename='scripts/camera-access.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/get-emotion.js') }}"></script>


</body>
</html>
