<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Cue Hackathon</title>
    <meta name="description" content="Social Cue Hackathon project." />
    <!--Accumulus Validator-->
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            --color-1: #4a7c59;
            --color-2: #6457a6;
            --color-3: #ef959d;
            --color-4: #d8d78f;
            --color-5: #89cff0;
            color: var(--color-4);

            --emotion-color-happy: #89cff0;
            --emotion-color-sad: #6457a6;
            --emotion-color-angry: #ef959d;
            --emotion-color-surprised: #d8d78f;
            --emotion-color-neutral: #4a7c59;
        }

        .video-frame {
            width: 95%;
            aspect-ratio: 1 / 1;
            border: 15px solid var(--emotion-color-happy);   
            border-radius: 30px;
            overflow: hidden;    
            max-width: 700px;
            max-height: 700px;
            margin: 2rem auto;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }

        #capture {
            display: block;
            margin: 1rem auto;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            background-color: var(--color-2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            background: var(--color-1);
            
        }

        header, footer {
            text-align: center;
            padding: 1rem;
        }

        main {
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            color: var(--color-4);
            display: flex;
            flex-direction: column;
        }

        section {
            background-color: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        #emotion-box {
            width: 100px;
            height: 100px;
            margin: 1rem auto;
            border-radius: 50%;
            background-color: var(--emotion-color-happy);
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <header>
        <h1>Social Cue Hackathon</h1>
    </header>

    <main>
        <section id="about">
            <h2>About</h2>
            <p>Social Cue is an AI-powered web app that analyzes facial expressions in real time to indentify human emotions.</p>
        </section>

        <section id="camera">
            <h2>Camera Feed</h2>
            <div class="video-frame">
                <video id="video webcam" autoplay muted playsinline></video>

            </div>
            <button id="capture">Analyze Emotion</button>
        </section>

        <section id="emotion-display">
            <h2>Detected Emotion</h2>
            <div id="emotion-box"></div>
            <p id="emotion-text">No emotion detected yet.</p>
        </section>
    </main>

    <footer>
        <small>&copy; 2025</small>
    </footer>
    <script src="scripts/camera-access.js"></script>

</body>
</html>
