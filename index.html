<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Cue Hackathon</title>
    <meta name="description" content="Starter HTML boilerplate for the Social Cue Hackathon project." />
    <link rel="stylesheet" href="styles.css" />
    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            --color-1: #4a7c59;
            --color-2: #6457a6;
            --color-3: #ef959d;
            --color-4: #d8d78f;
            --color-5: #89cff0;
            color: var(--color-4);
        }

        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            background: var(--color-1);
            
        }

        header, footer {
            text-align: center;
            padding: 1rem;
        }

        main {
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            color: var(--color-4);
        }
    </style>
</head>
<body>
    <header>
        <h1>Social Cue Hackathon</h1>
    </header>

    <main>
        <section id="about">
            <h2>About</h2>
            <p>Social Cue is an AI-powered web app that analyzes facial expressions in real time to indentify human emotions.</p>
        </section>

        <section id="camera">
            <h2>Camera Feed</h2>
            <video id="video" width="640" height="480" autoplay muted></video>
            <button id="capture">Analyze Emotion</button>
        </section>

        <section id="emotion-display">
            <h2>Detected Emotion</h2>
            <div id="emotion-box"></div>
            <p id="emotion-text">No emotion detected yet.</p>
        </section>
    </main>

    <footer>
        <small>&copy; 2025</small>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
